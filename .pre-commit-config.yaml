# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: local
  hooks:
  - id: uv sync --frozen --all-packages --group --all-groups
    name: uv sync --frozen --all-packages --group --all-groups
    entry: uv sync --frozen --all-packages --group --all-groups
    language: system
    pass_filenames: false
    require_serial: true
    always_run: true

  - id: uv run ruff format --check --group --all-groups
    name: uv run ruff format --check --group --all-groups
    entry: uv run ruff format --check --group --all-groups
    language: system
    pass_filenames: false
    always_run: true

  - id: uv run ruff check --group --all-groups
    name: uv run ruff check --group --all-groups
    entry: uv run ruff check --group --all-groups
    language: system
    pass_filenames: false
    always_run: true
