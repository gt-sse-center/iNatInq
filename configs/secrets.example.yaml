# =============================================================================
# Secrets Template
# =============================================================================
#
# ⚠️  NEVER commit this file with real values!
#
# HOW TO USE:
#   Option 1 (Development): Copy to secrets.yaml and fill in values
#   Option 2 (Production):  Use environment variables (recommended)
#
# For production, set these environment variables instead:
#   STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY
#   QDRANT_API_KEY, WEAVIATE_API_KEY
#   OPENAI_API_KEY
#   DATABRICKS_TOKEN
#
# =============================================================================

# Storage credentials (S3/MinIO)
storage:
  access_key: "your-access-key-here"
  secret_key: "your-secret-key-here"

# Vector database API keys
vector_databases:
  qdrant:
    api_key: ""               # Required for Qdrant Cloud
  weaviate:
    api_key: ""               # Required for Weaviate Cloud

# Embedding provider API keys
embeddings:
  openai:
    api_key: ""               # Required if using OpenAI embeddings

# Databricks (if using Databricks instead of Ray)
databricks:
  token: ""                   # Databricks personal access token


# =============================================================================
# Environment Variable Mapping
# =============================================================================
# For production, use these environment variables instead of this file:
#
# Storage:
#   S3_ACCESS_KEY_ID       → storage.access_key
#   S3_SECRET_ACCESS_KEY   → storage.secret_key
#
# Vector DBs:
#   QDRANT_API_KEY         → vector_databases.qdrant.api_key
#   WEAVIATE_API_KEY       → vector_databases.weaviate.api_key
#
# Embeddings:
#   OPENAI_API_KEY         → embeddings.openai.api_key
#
# Databricks:
#   DATABRICKS_TOKEN       → databricks.token
#   DATABRICKS_HOST        → databricks.host
#
# =============================================================================
